# 79 GHz mid-range radar configuration
radar:
  fc: 7.9e+10
  B: 5.0e+8
  Tc: 4.0e-5
  chirp_num: 128
  sample_num: 1024
  antenna_num: 8
  angle_num: 180
  noise_figure_db: 10.0
  rx_gain_db: 20.0

pipeline:
  stages:
    - signal_generation
    - range_fft
    - doppler_fft
    - angle_fft
    - peak_detection
    - cfar
    - estimation
    - tracking
  detection:
    cfar_algorithm: ca_cfar
    guard_cells: 2
    reference_cells: 8
    pfa: 1.0e-4
  tracking:
    filter: kf
    association: gnn
    init_threshold: 3
    coast_threshold: 5
    dt: 0.05
  visualization:
    backend: mpl
    update_hz: 20
    panels: [rd_map, ra_map, trajectory, diagnostic]
  persistence:
    format: npz
    save_intermediate: true
    output_dir: data

scenario:
  type: multi_target
  num_frames: 50
  frame_interval: 0.05
  snr_db: 25.0
  swerling_model: 0
  targets:
    - id: 1
      initial_range: 50.0
      initial_velocity: 10.0
      initial_angle: 20.0
      rcs: 1.0
      motion: constant_velocity
    - id: 2
      initial_range: 35.0
      initial_velocity: -5.0
      initial_angle: -15.0
      rcs: 1.0
      motion: constant_velocity
